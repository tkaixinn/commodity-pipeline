apiVersion: batch/v1
kind: CronJob
metadata:
  name: commodity-pipeline
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: commodity-pipeline
              image: commodity-pipeline:latest
              imagePullPolicy: Never
              env:
                - name: DB_HOST
                  value: postgres
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: commodity_data
                - name: DB_USER
                  value: kaixin
                - name: DB_PASSWORD
                  value: localdevpassword
          restartPolicy: OnFailure